name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r ui/requirements-ui.txt -r mcp_server/requirements-mcp.txt
      # El dump (data/datos.csv) no está en Git (vive en DVC, con almacén local). En CI se regenera desde
      # OpenML con las mismas semillas. Aquí no se comprueba su hash contra DVC (test_datos_coinciden_con_dvc,
      # que sí corre en local): depende de las versiones de pandas y scikit-learn del entorno.
      - name: Regenerar el dump de datos
        env:
          PYTHONUTF8: "1"
        run: python -m drift.escenarios --desde-openml
      # Las pruebas de la API y del concept drift necesitan un MLflow con el modelo registrado.
      # Se levanta uno local y se entrenan solo 2 runs (el proyecto completo entrena 9).
      - name: Levantar MLflow, entrenar y registrar
        env:
          PYTHONUTF8: "1"
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlartifacts > mlflow.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 2; done
          python -m train.train --only lr-C1,gb-n50-lr0.1-d3
          python -m train.register
      - name: Pruebas
        env:
          PYTHONUTF8: "1"
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python -m pytest -v --deselect tests/test_datos.py::test_datos_coinciden_con_dvc

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de la API
        run: docker build -f docker/Dockerfile.serving -t adult-api:ci .
      - name: Construir la imagen de MLflow
        run: docker build -f docker/Dockerfile.mlflow -t adult-mlflow:ci .
